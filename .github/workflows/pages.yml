name: Publish Rusetat to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build and check every page
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || steps.pages.outputs.origin }}
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_INDEXABLE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SITE_INDEXABLE == 'true' && 'true' || 'false' }}
        run: |
          python scripts/build.py
          python scripts/check.py
          python scripts/check_machine_surface.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
